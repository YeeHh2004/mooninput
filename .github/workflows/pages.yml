name: Publish verified demo
on:
  workflow_run:
    workflows: [Test MoonInput]
    types: [completed]
    branches: [main]
permissions:
  actions: read
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  deploy:
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event != 'pull_request'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Ignore superseded builds
        id: fresh
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_SHA: ${{ github.event.workflow_run.head_sha }}
          REPOSITORY: ${{ github.repository }}
        run: |
          current=$(gh api "repos/$REPOSITORY/commits/main" --jq .sha)
          if [ "$current" = "$EXPECTED_SHA" ]; then echo "current=true" >> "$GITHUB_OUTPUT"; fi
      - uses: actions/download-artifact@v4
        if: steps.fresh.outputs.current == 'true'
        with:
          name: mooninput-web
          path: site
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/configure-pages@v5
        if: steps.fresh.outputs.current == 'true'
      - uses: actions/upload-pages-artifact@v3
        if: steps.fresh.outputs.current == 'true'
        with:
          path: site
      - uses: actions/deploy-pages@v4
        if: steps.fresh.outputs.current == 'true'
        id: deployment
